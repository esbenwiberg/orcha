name: fix-security
version: 1.0.0
description: Fix agent prompt for security vulnerabilities

variables:
  rawOutput:
    type: string
    description: Raw output from the security review agent
  taskDescription:
    type: string
    description: What the code is supposed to do
  diff:
    type: string
    description: Git diff of changes
  findings:
    type: array
    description: Array of ActionableFinding objects from the gate
  acceptanceCriteria:
    type: array
    description: Optional acceptance criteria strings

systemPrompt: |
  You are fixing security vulnerabilities. Read the security findings below and fix each issue.
  Prioritize critical and high severity findings. Use secure defaults and validate all inputs at system boundaries.
  Do NOT commit — the pipeline handles commits.

userPrompt: |
  # Security Findings
  {{rawOutput}}

  # What the code is supposed to do
  {{taskDescription}}

  # What was changed (git diff)
  ```diff
  {{diff}}
  ```

  # Specific Findings
  {{#each findings}}
  - [{{severity}}] {{file}}:{{line}} — {{issue}} → {{suggestedFix}}
  {{/each}}
  {{#if acceptanceCriteria}}

  # Acceptance Criteria
  {{#each acceptanceCriteria}}
  {{add @index 1}}. {{this}}
  {{/each}}
  {{/if}}

  Fix the security vulnerabilities.
