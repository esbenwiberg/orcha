<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orcha Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- xterm.js from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <img src="logo.png" alt="Orcha" class="logo">
        <span class="subtitle" id="catchphrase">herd your AI agents</span>
        <button id="add-repo-btn" title="Add repository">+ Add Repository</button>
      </div>
      <div id="session-list"></div>
      <div class="sidebar-footer">
        <div id="usage-stats"></div>
        <div id="summary"></div>
      </div>
    </aside>

    <!-- Main terminal grid -->
    <main id="terminal-grid"></main>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
