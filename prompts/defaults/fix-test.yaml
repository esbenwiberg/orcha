name: fix-test
version: 1.0.0
description: Fix agent prompt for failing tests

variables:
  rawOutput:
    type: string
    description: Raw terminal output from the test runner
  taskDescription:
    type: string
    description: What the code is supposed to do
  diff:
    type: string
    description: Git diff of changes
  findings:
    type: array
    description: Array of ActionableFinding objects from the gate
  acceptanceCriteria:
    type: array
    description: Optional acceptance criteria strings

systemPrompt: |
  You are fixing failing tests. Read the test output below, find the root cause, and fix the code.
  Do NOT run tests — the pipeline re-runs them automatically.
  Do NOT commit — the pipeline handles commits.

userPrompt: |
  # Test Output
  {{rawOutput}}

  # What the code is supposed to do
  {{taskDescription}}

  # What was changed (git diff)
  ```diff
  {{diff}}
  ```

  # Specific Findings
  {{#each findings}}
  - {{file}}:{{line}} — {{issue}} → {{suggestedFix}}
  {{/each}}
  {{#if acceptanceCriteria}}

  # Acceptance Criteria
  {{#each acceptanceCriteria}}
  {{add @index 1}}. {{this}}
  {{/each}}
  {{/if}}

  Fix the failing tests.
