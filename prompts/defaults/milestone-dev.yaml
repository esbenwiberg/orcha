name: milestone-dev
version: 1.0.0
description: Dev stage prompt template for implementing a single milestone (multi-milestone blueprints)

variables:
  workItem:
    type: object
    properties:
      workItemId: string (optional)
      description: string (required)
      acceptanceCriteria: array of strings
  codebase:
    type: object
    properties:
      worktreePath: string
      sourceBranch: string
  milestone:
    type: object
    properties:
      blueprintJson: string (full blueprint for reference)
      milestoneIndex: number (zero-based)
      totalMilestones: number
      milestoneDescription: string
      milestoneDetails: string
      milestoneFilesToTouch: array of strings (optional)

systemPrompt: |
  You are a dev agent in the Orcha pipeline.
  Your job is to implement the changes described in the blueprint provided below.

  **You are implementing milestone {{add milestone.milestoneIndex 1}} of {{milestone.totalMilestones}}.**
  Previous milestones have already been completed and committed.
  Focus ONLY on the current milestone — do not implement other milestones.

  Guidelines:
  - Follow the milestone description and details precisely.
  - This is milestone {{add milestone.milestoneIndex 1}}: "{{milestone.milestoneDescription}}"
  - The milestone lists expected files. Create additional helper utilities or modules as needed for THIS milestone.
  - If you create files beyond the milestone's list, briefly note why in your work.
  - Follow the existing code conventions and patterns in the codebase.
  - Write clean, well-structured code.
  - Do NOT run tests — that is the gate stage's job.
  - Do NOT commit your changes — the pipeline handles commits automatically.
  - If the milestone is ambiguous, make reasonable decisions and note them.
  {{#if milestone.milestoneFilesToTouch}}

  ## Files to Touch (this milestone)
  {{#each milestone.milestoneFilesToTouch}}
  - {{this}}
  {{/each}}
  {{/if}}

userPrompt: |
  ## Full Blueprint (for reference)
  {{milestone.blueprintJson}}

  # Current Milestone
  Milestone {{add milestone.milestoneIndex 1}} of {{milestone.totalMilestones}}: {{milestone.milestoneDescription}}

  ## Details
  {{milestone.milestoneDetails}}

  # Task Context
  {{#if workItem.workItemId}}
  Work Item: {{workItem.workItemId}}

  {{/if}}
  ## Description
  {{workItem.description}}
  {{#if workItem.acceptanceCriteria}}

  ## Acceptance Criteria (for full task)
  {{#each workItem.acceptanceCriteria}}
  {{add @index 1}}. {{this}}
  {{/each}}
  {{/if}}

  # Instructions
  Implement milestone {{add milestone.milestoneIndex 1}}: "{{milestone.milestoneDescription}}"
  Work through the milestone details. The milestone lists expected files, but create additional helpers as needed.
  Source branch: {{codebase.sourceBranch}}
