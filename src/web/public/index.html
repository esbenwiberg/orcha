<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orcha Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- xterm.js from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.esm.min.mjs';
    window.mermaid = mermaid;
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  </script>

  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <img src="logo.png" alt="Orcha" class="logo">
        <span class="subtitle" id="catchphrase">herd your AI agents</span>
      </div>
      <div id="session-list"></div>
      <div id="pipeline-list"></div>
      <div class="sidebar-footer">
        <div id="action-bar"></div>
        <div id="usage-stats"></div>
        <div id="vm-health"></div>
        <div id="summary"></div>
      </div>
    </aside>

    <!-- Main content area -->
    <main id="terminal-grid"></main>

    <!-- Pipeline detail panel (hidden by default) -->
    <div id="pipeline-detail" class="pipeline-detail" style="display: none;"></div>
  </div>

  <script src="app.js?v=17"></script>
</body>
</html>
